<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taiga Game Collection</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 50px 20px;
      background: linear-gradient(135deg, #fff4d6, #ffd6e7);
      color: #333;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 36px;
    }

    .description {
      margin-bottom: 40px;
      color: #666;
    }

    .game-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
    }

    .game-card {
      display: block;
      width: 280px;
      padding: 32px 20px;
      background: white;
      color: #333;
      text-decoration: none;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.18);
    }

    .game-card h2 {
      margin: 0 0 12px;
      color: #ff668f;
    }

    .game-card p {
      margin: 0;
      color: #666;
    }
  </style>

</head>

<body>
  <h1>ゲーム一覧</h1>
  <p class="description">制作したゲームを公開しています。</p>

  <div class="game-list">
    <a class="game-card" href="./suika/">
      <h2>スイカゲーム</h2>
      <p>同じフルーツを合体させて、大きなフルーツを作るゲーム</p>
    </a>
  </div>
</body>
</html>
